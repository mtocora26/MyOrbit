spring.application.name=MyOrbit
spring.config.import=optional:file:./application-local.properties

# Correos que reciben el rol ADMIN al registrarse (separados por coma). Ejemplo en application-local.properties:
# myorbit.admin-emails=tu.correo@uni.edu

# Crea los indices declarados con @Indexed (correo unico, TTL de sesiones).
spring.data.mongodb.auto-index-creation=true

# Duracion de la sesion desde el login (30d, 7d, 12h...).
myorbit.session-ttl=30d

# Origenes que pueden llamar a /api desde otro origen (separados por coma). Vacio = ninguno.
# Con el proxy de Vite o nginx el frontend usa el mismo origen y no lo necesita.
# myorbit.cors.allowed-origins=http://localhost:8443,http://localhost:5173

# Recordatorios (fecha límite 1 día y 1 hora antes; a la hora de la mañana: vencidas, evaluaciones y materias en riesgo;
# a la hora de hábitos: hábitos pendientes). Corren cada hora según la zona horaria de cada usuario.
# myorbit.reminders.enabled=false
# myorbit.reminders.hour=8
# myorbit.reminders.habit-hour=20
# myorbit.reminders.cron=0 0 * * * *
# Avisos de clase (30 min antes) y de eventos con hora: corren cada minuto.
# myorbit.reminders.class-cron=0 * * * * *

# Web Push (claves VAPID). Sin ellas no hay push web. Genera el par con: npx web-push generate-vapid-keys
# myorbit.push.vapid.public-key=
# myorbit.push.vapid.private-key=
# myorbit.push.vapid.subject=mailto:tu.correo@uni.edu
