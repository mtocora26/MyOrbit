spring.application.name=MyOrbit
spring.config.import=optional:file:./application-local.properties

# Correos que reciben el rol ADMIN al registrarse (separados por coma). Ejemplo en application-local.properties:
# myorbit.admin-emails=tu.correo@uni.edu

# Crea los indices declarados con @Indexed (correo unico, TTL de sesiones).
spring.data.mongodb.auto-index-creation=true

# Duracion de la sesion desde el login (30d, 7d, 12h...).
myorbit.session-ttl=30d

# Origenes que pueden llamar a /api desde otro origen (separados por coma). Vacio = ninguno.
# Con el proxy de Vite o nginx el frontend usa el mismo origen y no lo necesita.
# myorbit.cors.allowed-origins=http://localhost:8443,http://localhost:5173
