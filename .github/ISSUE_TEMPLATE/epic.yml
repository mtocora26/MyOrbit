name: Épica
description: Agrupa varios issues de un mismo objetivo
labels: ["epic"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Objetivo
    validations:
      required: true
  - type: textarea
    id: issues
    attributes:
      label: Issues
      placeholder: |
        - [ ] #
        - [ ] #
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Decisiones de diseño / patrones
